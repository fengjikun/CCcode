    <text x="175" y="191" text-anchor="middle" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="28" font-weight="700">L1</text>
    <text x="246" y="176" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="700">业务数据接入层</text>
    <text x="246" y="208" fill="#475569" font-family="Arial, sans-serif" font-size="16">连接文档、系统与真实执行数据，为模型锻造提供原料</text>
  </g>

  <g>
