    <text x="161" y="333" text-anchor="middle" fill="#6D28D9" font-family="Arial, sans-serif" font-size="28" font-weight="700">L2</text>
    <text x="232" y="318" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="700">本体与知识层</text>
