<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>贪吃蛇</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      color: #4ecca3;
      letter-spacing: 4px;
    }

    #scoreboard {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
      font-size: 1rem;
    }

    #scoreboard span { color: #4ecca3; font-weight: bold; font-size: 1.2rem; }

    #game-container {
      position: relative;
    }

    canvas {
      border: 3px solid #4ecca3;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(78, 204, 163, 0.3);
      display: block;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    #overlay h2 { font-size: 2rem; color: #4ecca3; margin-bottom: 12px; }
    #overlay p  { font-size: 1rem; color: #ccc; margin-bottom: 24px; }

    #startBtn {
      padding: 12px 36px;
      font-size: 1rem;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s;
    }
    #startBtn:hover { transform: scale(1.05); }

    #controls {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(2, 48px);
      gap: 6px;
    }

    .ctrl-btn {
      background: #16213e;
      border: 2px solid #4ecca3;
      border-radius: 6px;
      color: #4ecca3;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background 0.1s;
    }
    .ctrl-btn:active { background: #4ecca3; color: #1a1a2e; }

    #btn-up    { grid-column: 2; grid-row: 1; }
    #btn-left  { grid-column: 1; grid-row: 2; }
    #btn-down  { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

<h1>贪 吃 蛇</h1>

<div id="scoreboard">
  <div>得分：<span id="score">0</span></div>
  <div>最高：<span id="best">0</span></div>
  <div>速度：<span id="level">1</span></div>
</div>

<div id="game-container">
  <canvas id="canvas" width="400" height="400"></canvas>
  <div id="overlay">
    <h2 id="overlay-title">贪 吃 蛇</h2>
    <p id="overlay-msg">使用方向键或下方按钮控制</p>
    <button id="startBtn">开始游戏</button>
  </div>
</div>

<div id="controls">
  <button class="ctrl-btn" id="btn-up">▲</button>
  <button class="ctrl-btn" id="btn-left">◀</button>
  <button class="ctrl-btn" id="btn-down">▼</button>
  <button class="ctrl-btn" id="btn-right">▶</button>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  const CELL   = 20;
  const COLS   = canvas.width  / CELL;
  const ROWS   = canvas.height / CELL;

  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const levelEl = document.getElementById('level');
  const overlay      = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayMsg   = document.getElementById('overlay-msg');
  const startBtn     = document.getElementById('startBtn');

  let snake, dir, nextDir, food, score, best, gameLoop, speed;

  function init() {
    snake   = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir     = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score   = 0;
    speed   = 150;
    best    = parseInt(localStorage.getItem('snakeBest') || '0');
    scoreEl.textContent = 0;
    bestEl.textContent  = best;
    levelEl.textContent = 1;
    placeFood();
    clearInterval(gameLoop);
    gameLoop = setInterval(tick, speed);
  }

  function placeFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function tick() {
    dir = { ...nextDir };
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 碰墙
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    // 碰自身
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('snakeBest', best);
      }
      // 每5分加速
      if (score % 5 === 0) {
        speed = Math.max(60, speed - 15);
        levelEl.textContent = Math.floor((150 - speed) / 15) + 1;
        clearInterval(gameLoop);
        gameLoop = setInterval(tick, speed);
      }
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    // 背景
    ctx.fillStyle = '#0f3460';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
    }

    // 食物（带光晕）
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    const grd = ctx.createRadialGradient(fx, fy, 2, fx, fy, CELL / 2);
    grd.addColorStop(0, '#ff6b6b');
    grd.addColorStop(1, '#c0392b');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(fx, fy, CELL / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    // 蛇身
    snake.forEach((seg, i) => {
      const ratio = 1 - i / snake.length * 0.6;
      ctx.fillStyle = i === 0
        ? '#4ecca3'
        : `rgba(78, 204, 163, ${ratio})`;
      const pad = i === 0 ? 1 : 2;
      ctx.beginPath();
      ctx.roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 4);
      ctx.fill();
    });

    // 蛇眼
    const ex = snake[0].x * CELL + (dir.x === 1 ? 13 : dir.x === -1 ? 5 : 10);
    const ey = snake[0].y * CELL + (dir.y === 1 ? 13 : dir.y === -1 ? 5 : 10);
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.arc(ex, ey, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function gameOver() {
    clearInterval(gameLoop);
    overlayTitle.textContent = '游戏结束';
    overlayMsg.textContent   = `得分：${score}`;
    startBtn.textContent     = '再来一局';
    overlay.style.display    = 'flex';
  }

  // 方向键控制
  const DIR_MAP = {
    ArrowUp:    { x:  0, y: -1 },
    ArrowDown:  { x:  0, y:  1 },
    ArrowLeft:  { x: -1, y:  0 },
    ArrowRight: { x:  1, y:  0 },
  };

  document.addEventListener('keydown', e => {
    const d = DIR_MAP[e.key];
    if (!d) return;
    e.preventDefault();
    // 禁止反向
    if (d.x + dir.x !== 0 || d.y + dir.y !== 0) nextDir = d;
  });

  // 触控按钮
  function setDir(d) {
    if (d.x + dir.x !== 0 || d.y + dir.y !== 0) nextDir = d;
  }
  document.getElementById('btn-up').addEventListener('click',    () => setDir({ x: 0, y: -1 }));
  document.getElementById('btn-down').addEventListener('click',  () => setDir({ x: 0, y:  1 }));
  document.getElementById('btn-left').addEventListener('click',  () => setDir({ x: -1, y: 0 }));
  document.getElementById('btn-right').addEventListener('click', () => setDir({ x:  1, y: 0 }));

  // 开始按钮
  startBtn.addEventListener('click', () => {
    overlay.style.display = 'none';
    init();
    draw();
  });
</script>
</body>
</html>
