services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cccode-app:latest
    container_name: cccode-app
    ports:
      - "9000:9000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
